<!doctype html>
<html lang="en">

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0e12" />

    <title>Andrew's Website</title>

      name="description"
      content="Andrew M C Li — Software, Embedded, Fullstack and Game Developer. 2A Computer Engineering student at the University of Waterloo."

    <link rel="icon" type="image/svg+xml" href="/firefly.svg" />

    <!--
      Social link preview (Open Graph + Twitter Card).
      Replace the two og:url / twitter:url values below with your deployed URL
      once known — until then, most platforms fall back to using the URL you
      pasted, so the card still renders correctly.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Andrew M C Li" />
    <meta property="og:title" content="Andrew's Website" />
    <meta
      property="og:description"
      content="Software, Embedded, Fullstack and Game Developer. 3rd-Year Computer Engineering @ University of Waterloo."
    />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Andrew M C Li's portfolio preview card, Firefly / SAM themed." />
    <meta property="og:url" content="https://andrewmcli.net/" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Andrew's Website" />
    <meta
      name="twitter:description"
      content="Software, Embedded, Fullstack and Game Developer. 2A Computer Engineering @ University of Waterloo."
    />
    <meta name="twitter:image" content="/og-image.png" />
